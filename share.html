<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vidya Topper - Content Sharing</title>
    <!-- Modern Premium Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --accent-glow: radial-gradient(circle at 50% 50%, rgba(99, 102, 241, 0.15) 0%, transparent 60%);
            --card-bg: rgba(255, 255, 255, 0.03);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --text-primary: #ffffff;
            --text-secondary: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient background glow */
        body::before {
            content: '';
            position: absolute;
            width: 600px;
            height: 600px;
            background: var(--accent-glow);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 480px;
            padding: 24px;
            text-align: center;
        }

        /* Glassmorphism Card */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 28px;
            padding: 40px 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Logo Area */
        .logo-container {
            margin-bottom: 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo-badge {
            width: 68px;
            height: 68px;
            background: var(--primary-gradient);
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 28px;
            font-family: 'Outfit', sans-serif;
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
            margin-bottom: 12px;
        }

        .app-name {
            font-family: 'Outfit', sans-serif;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Content Information */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.25);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
        }

        .content-title {
            font-size: 20px;
            font-weight: 700;
            line-height: 1.4;
            color: var(--text-primary);
            margin-bottom: 8px;
            word-wrap: break-word;
            word-break: break-word;
        }

        .content-subject {
            font-size: 13px;
            font-weight: 600;
            color: #818cf8;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 32px;
        }

        /* Spinner & Status */
        .spinner-container {
            position: relative;
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
        }

        .spinner {
            box-sizing: border-box;
            position: absolute;
            width: 100%;
            height: 100%;
            border: 4px solid rgba(99, 102, 241, 0.1);
            border-radius: 50%;
            border-left-color: #6366f1;
            animation: spin 1s linear infinite;
        }

        .spinner-inner {
            box-sizing: border-box;
            position: absolute;
            width: 70%;
            height: 70%;
            top: 15%;
            left: 15%;
            border: 4px solid rgba(16, 185, 129, 0.1);
            border-radius: 50%;
            border-right-color: #10b981;
            animation: spin-reverse 1.2s linear infinite;
        }

        .status-text {
            font-size: 15px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 32px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Actions */
        .btn {
            width: 100%;
            padding: 16px 24px;
            border-radius: 16px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(79, 70, 229, 0.3);
            margin-bottom: 12px;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        /* Animations */
        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes spin-reverse {
            to { transform: rotate(-360deg); }
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card > * {
            animation: fadeIn 0.6s ease forwards;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="card">
            <!-- Logo Section -->
            <div class="logo-container">
                <div class="logo-badge">VT</div>
                <div class="app-name">Vidya Topper</div>
            </div>

            <!-- Content Badge -->
            <div id="content-badge" class="badge">Loading...</div>

            <!-- Title -->
            <h1 id="title" class="content-title">Fetching Details...</h1>
            <div id="subject" class="content-subject"></div>

            <!-- Custom Spinner -->
            <div class="spinner-container">
                <div class="spinner"></div>
                <div class="spinner-inner"></div>
            </div>

            <!-- Loader status text -->
            <p class="status-text">Opening in Vidya Topper App...</p>

            <!-- Fallback CTAs -->
            <a id="btn-open" href="#" class="btn btn-primary">
                Open in App
            </a>
            <a href="https://play.google.com/store/apps/details?id=in.vidyatopper.student" class="btn btn-secondary">
                Install App from Play Store
            </a>
        </div>
    </div>

    <script>
        // Helper to parse query parameters
        function getQueryParam(name) {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get(name);
        }

        // Get and decode values
        const type = getQueryParam('type') || 'video';
        const id = getQueryParam('id') || '';
        const title = decodeURIComponent(getQueryParam('title') || 'Educational Content');
        const url = decodeURIComponent(getQueryParam('url') || '');
        const subject = decodeURIComponent(getQueryParam('subject') || '');

        // Clean up title
        const cleanTitle = title.replace(/_/g, ' ').replace('.mp4', '').replace('.pdf', '');

        // Update DOM elements
        document.getElementById('title').textContent = cleanTitle;
        
        if (subject) {
            document.getElementById('subject').textContent = subject.replace(/_/g, ' ').toUpperCase();
        }

        const badgeEl = document.getElementById('content-badge');
        if (type === 'video') {
            badgeEl.innerHTML = '🎥 Video Lecture';
        } else if (type === 'pdf') {
            badgeEl.innerHTML = '📚 Study Notes';
        } else {
            badgeEl.innerHTML = '✨ Free Material';
        }

        // Construct App Scheme deep link
        // Format: vidyatopper://share?type=...&id=...&title=...&url=...&subject=...
        const deepLinkUrl = `vidyatopper://share?type=${type}&id=${id}&title=${encodeURIComponent(title)}&url=${encodeURIComponent(url)}&subject=${encodeURIComponent(subject)}`;
        
        // Update the fallback Open button
        document.getElementById('btn-open').href = deepLinkUrl;

        // Auto-redirect mechanism
        function attemptRedirect() {
            // 1. Try to open the app via custom scheme
            window.location.href = deepLinkUrl;

            // 2. Fallback to Google Play Store after 1.5 seconds if the page is still active
            const start = Date.now();
            setTimeout(() => {
                // If user switched apps, Date.now() - start will be significantly longer than 1500ms
                // Only redirect if they are still on this page (meaning app didn't open)
                if (Date.now() - start < 1800) {
                    window.location.href = "https://play.google.com/store/apps/details?id=in.vidyatopper.student";
                }
            }, 1500);
        }

        // Trigger on load
        window.onload = attemptRedirect;
    </script>
</body>
</html>
